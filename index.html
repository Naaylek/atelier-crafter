<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier Crafter — VW Crafter L2H1 2013</title>
<link rel="stylesheet" href="css/style.css?v=1785654338">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚐</text></svg>">
<!-- BUILD marque une version sur chaque module : le navigateur reprend toujours
     la dernière version après publication, sans attendre l'expiration du cache.
     « Mettre en ligne.command » met à jour tous les ?v= automatiquement. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
    "three/addons/controls/TransformControls.js": "./vendor/TransformControls.js",
    "three/addons/loaders/GLTFLoader.js": "./vendor/GLTFLoader.js",
    "./js/app.js":      "./js/app.js?v=1785654338",
    "./js/store.js":    "./js/store.js?v=1785654338",
    "./js/data.js":     "./js/data.js?v=1785654338",
    "./js/dash.js":     "./js/dash.js?v=1785654338",
    "./js/planning.js": "./js/planning.js?v=1785654338",
    "./js/budget.js":   "./js/budget.js?v=1785654338",
    "./js/elec.js":     "./js/elec.js?v=1785654338",
    "./js/eau.js":      "./js/eau.js?v=1785654338",
    "./js/diagram.js":  "./js/diagram.js?v=1785654338",
    "./js/vanplan.js":  "./js/vanplan.js?v=1785654338",
    "./js/van3d.js":    "./js/van3d.js?v=1785654338",
    "./js/ui.js":       "./js/ui.js?v=1785654338",
    "./js/secret.js":   "./js/secret.js?v=1785654338",
    "./js/sync.js":     "./js/sync.js?v=1785654338"
  }
}
</script>
</head>
<body>
<header id="topbar">
  <div id="logo">🚐 <strong>Atelier Crafter</strong><span class="sub">VW Crafter 35 L2H1 · 2013 · <span id="hdr-plate">••••••</span></span></div>
  <nav id="tabs">
    <button data-tab="dash" class="active">🏠 Tableau de bord</button>
    <button data-tab="planning">📋 Planning</button>
    <button data-tab="budget">💶 Budget</button>
    <button data-tab="elec">⚡ Électricité</button>
    <button data-tab="eau">💧 Eau</button>
    <button data-tab="van">🚐 Van 3D</button>
  </nav>
  <div id="topactions">
    <button id="btn-lock-global" title="Afficher les infos privées (code à 4 chiffres)">🔒</button>
    <button id="btn-undo" title="Annuler (⌘Z)">↩️</button>
    <button id="btn-redo" title="Rétablir (⌘⇧Z)">↪️</button>
    <button id="btn-history" title="Historique des modifications">🕘</button>
    <button id="btn-sync" title="Synchronisation entre appareils">☁️</button>
    <button id="btn-export" title="Exporter toutes les données en fichier JSON">💾 Exporter</button>
    <button id="btn-import" title="Importer un fichier JSON">📂 Importer</button>
    <input type="file" id="file-import" accept=".json" hidden>
  </div>
  <div id="sync-panel" hidden>
    <div class="hp-head"><strong>☁️ Synchro entre appareils</strong><button id="sp-close">✕</button></div>
    <div id="sp-body"></div>
  </div>
  <div id="history-panel" hidden>
    <div class="hp-head"><strong>🕘 Historique</strong><button id="hp-close">✕</button></div>
    <div id="hp-list"></div>
  </div>
</header>

<main>
  <section id="tab-dash" class="tab active"></section>
  <section id="tab-planning" class="tab"></section>
  <section id="tab-budget" class="tab"></section>
  <section id="tab-elec" class="tab"></section>
  <section id="tab-eau" class="tab"></section>
  <section id="tab-van" class="tab"></section>
</main>

<div id="toast"></div>
<script type="module" src="js/app.js?v=1785654338"></script>
</body>
</html>
